<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102137" />
    <title>ऑटो वाला — The Soundtrack of Every Ride</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="AutoBala music ride">
      <div class="scene__image" aria-hidden="true"></div>
      <div class="scene__shade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="clock" aria-live="polite"><span id="time">--:--</span><small id="date">LOADING DAY</small></div>
        <button class="status" id="status" type="button" aria-label="Toggle ride status"><span></span><strong id="statusText">METER ON</strong></button>
      </header>

      <section class="hero">
        
        <h1>ऑटो वाला</h1>
        <p>The Soundtrack of Every Ride</p>
      </section>

      <section class="player glass" aria-label="Fare meter music player">
        <div class="meter">
          <div class="meter__label"><span>FARE</span><span id="meterState">WAITING</span></div>
          <output id="fare">₹ 24.00</output>
        </div>
        <button class="hire-flag" id="hireFlag" type="button" aria-label="Flip availability flag"><span class="hire-flag__front">FOR <b>HIRE</b></span><span class="hire-flag__back">OCCU <b>PIED</b></span></button>
        <div class="track">
          <div class="track__meta"><div><p id="trackTitle">Your YouTube playlist</p><span id="trackArtist">loading the first track…</span></div><b id="distance">01 / 03</b></div>
          <div class="scrubber"><input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress" /><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div>
        </div>
        <div class="controls">
          <button class="icon-btn" id="previous" type="button" aria-label="Previous track">◀</button>
          <button class="play-btn" id="play" type="button" aria-label="Play music"><span></span></button>
          <button class="icon-btn" id="next" type="button" aria-label="Next track">▶</button>
        </div>
        <div class="volume"><span>◖</span><input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume" /><span>◗</span></div>
      </section>

      <button class="tip" id="tip" type="button"><span>✦</span> tap meter to ride</button>
    </main>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal__card">
        <button class="modal__close" id="closeModal" type="button" aria-label="Close">×</button>
        <div class="receipt-top"><span>★ RIDE COMPLETED ★</span></div>
        <p class="receipt-kicker">THANKS FOR THE RIDE</p>
        <h2 id="modalTitle">That was a<br /><i>good one.</i></h2>
        <div class="bill"><span>Final fare</span><strong id="finalFare">₹ 32.00</strong><small>UPI • CASH • GOOD KARMA</small></div>
        <button class="pay" id="pay" type="button">Pay driver <span>→</span></button>
        <p class="payment-note" id="paymentNote">No surge pricing. Just vibes.</p>
      </div>
    </div>
    <div class="youtube-embed" aria-hidden="true"><div id="youtubePlayer"></div></div>
    <script src="app.js"></script>
  </body>
</html>
